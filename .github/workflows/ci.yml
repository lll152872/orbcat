# 跨平台编译验证 CI
#
# ## 为什么需要这个
#
# 2026-10-10 抽出 `platform/` 层后，「macOS 能不能编译」成为 Mac 适配的**唯一未知数**。
# 本机（Windows）无法验证：`cargo check --target aarch64-apple-darwin` 会卡在
# Tauri 自己的依赖 `objc2-exception-helper`（需要 Xcode 的 Objective-C 编译器）。
# 所以唯一可靠的验证方式是**在真实 macOS runner 上跑**。
#
# ## 覆盖范围
#
# | job | 平台 | 验证什么 |
# |---|---|---|
# | `build-windows` | windows-latest (x64) | Windows 版没有回归（506 个测试 + tsc + vitest） |
# | `build-windows-arm` | windows-11-arm (arm64) | Windows ARM64 版能编出可执行文件 |
# | `build-macos` | macos-14 (arm64) | **Mac 版能编译**（本次的核心目的） |
#
# ## 注意：这里只编译，不跑测试
#
# macOS runner 上**跑不了**前台上下文相关测试 —— 那些需要真实的
# Accessibility 授权与前台窗口，CI 环境没有。`platform/macos.rs` 里的
# `osascript` 调用在无 GUI 会话的 CI 上会失败并降级，这是**预期行为**。
#
# 真正的端到端验证（授权弹窗、系统设置跳转）需要在有人使用的 Mac 上手动走查。

# ## 触发条件
#
# 三类：
#   1. 分支 push（master / feat/** / fix/**）—— 日常回归
#   2. PR → master —— 合入前校验
#   3. **`v*` tag push** —— 发版。
#      没有第 3 类的话，打 tag 推上去 CI 根本不会跑，release 就成了
#      "没有三个平台编译证据的裸发布"。2026-10-12 重打 v1.0.0 时补上。
#
# ⚠️ `workflow_dispatch` 保留：tag 推送偶发不触发（或想在发版前先空跑一遍）时
#    可以手动拉起来，不必靠删 tag 重推。

name: CI

on:
  push:
    branches: [master, "feat/**", "fix/**"]
    tags: ["v*"]
  pull_request:
    branches: [master]
  workflow_dispatch:

# 取消同一分支的旧运行，省 Actions 配额
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Windows —— 防回归
  # ---------------------------------------------------------------------------
  build-windows:
    name: Windows (regression guard)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: npm ci
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      # 防夹带闸门 · 仓库级。
      # build.rs 里那道只管「编进二进制的骨架」，管不到 git 跟踪、
      # tauri 打包配置、发布脚本拷贝目标这三条进包路径 —— 它们要这道。
      - name: No-user-data gate
        run: npm run check:no-user-data

      - name: Unit tests (frontend)
        run: npx vitest run

      # ⚠️ 必须在下面任何 cargo 命令**之前**跑（2026-10-11 实测踩坑）。
      #   tauri-build 在编译期就解析 bundle.resources，而 ResourcePaths::from_map
      #   走的是 Walk（递归列目录）不是 glob —— 源目录不存在就直接
      #   `error: resource path '../dist' doesn't exist`，build script exit 101。
      #   dist/ 又在 .gitignore 里，CI 全新 checkout 时根本没有它。
      #   所以「前端是构建产物」这件事要求：先 build，再碰 cargo。
      - name: Frontend build (dist must exist before cargo)
        run: npm run build

      - name: Rust check
        run: cargo check --manifest-path src-tauri/Cargo.toml --lib

      - name: Rust tests
        run: cargo test --lib --manifest-path src-tauri/Cargo.toml

      # ---- 集成测试（src-tauri/tests/）-------------------------------
      #
      # ⚠️ 这一步以前**从来没有过**（2026-10-23 守门实测：ci.yml 全文只有两处
      #   `cargo test --lib`，build-windows / build-macos 各一处，
      #   `cargo test --tests` 一次都没跑过）⇒
      #   `src-tauri/tests/` 下的集成测试（pi_integration / pi_mcp_e2e /
      #   pi_mock_e2e / pi_l1_project_e2e / pi_security_e2e …）**在 CI 里一条都不执行**，
      #   集成层回归只能靠人本地跑。
      #
      #   为什么用 `--tests` 而不是逐个 `--test pi_xxx`：
      #   cargo 的 `--tests` = 所有 test=true 的目标，**包含 lib 单测**，
      #   所以上面那条 `--lib` 会再跑一遍（652 个 ≈ 4s，可接受）。
      #   换来的是：**新增的集成测试文件自动进 CI**，不用改这里 ——
      #   逐个枚举的写法一旦漏了新文件，就会静悄悄不执行，正是本条要修的病。
      #
      #   位置必须在上面 "Frontend build" 之后 —— tauri-build 递归 Walk dist/，
      #   目录不存在直接 exit 101（那条踩坑注释别动）。
      #
      # ---- ⚠️⚠️ 「假绿」防线（这一段才是本步骤的要点）----------------
      #   `src-tauri/tests/pi_*.rs` 里有两个**静默跳过**入口：
      #     ① `runtime_dir()` 找不到 runtime/ → 「跳过：runtime/ 未构建」
      #     ② `orbcat_data_dir()` 找不到 models.json → 「跳过：找不到 orbcat 的 agent-data/」
      #   两者都是 `return` 掉这个用例，**测试照样算通过** ⇒
      #   只加一行 `cargo test --tests` = CI 全绿而一条 e2e 都没跑（比不跑更坏，
      #   因为它让人以为集成层有守门人了）。
      #   ⇒ ① 用下面的复合 action 把 runtime/{node,pi} 装上并**断言它真在**；
      #     ② 同一套 action 补一份夹具 models.json；
      #     ③ 这一步跑完再**扫一遍输出**：出现上面两种「跳过」字样就红。
      - name: Setup runtime for integration tests (node + pi)
        if: runner.os == 'Windows'
        uses: ./.github/actions/setup-runtime

      - name: Rust integration tests (src-tauri/tests)
        shell: bash
        run: |
          set -o pipefail
          # ⚠️ `-- --nocapture` 不能省：cargo 默认**不打印通过用例的 stderr**，
          #   而「跳过：runtime/ 未构建」正是用 eprintln 打出来的 ⇒
          #   不加 --nocapture，下面的 grep 永远匹配不到，断言形同虚设（= 又一次假绿）。
          cargo test --tests --manifest-path src-tauri/Cargo.toml -- --nocapture 2>&1 | tee cargo-integration-tests.log
          # ⚠️ 「跳过」= 没真跑。这里必须红 —— 见上面「假绿防线」。
          #   注意只拦这两个**坏跳过**；「跳过：这是打真模型的测试」是设计内的
          #   （真模型测试要显式设 ORBCAT_REAL_MODEL=1 才跑），不在拦名单里。
          if grep -q "跳过：runtime/ 未构建" cargo-integration-tests.log; then
            echo "::error::pi 集成测试因缺 runtime/ 全部跳过 —— 这是假绿，不是通过"
            exit 1
          fi
          if grep -q "跳过：找不到 orbcat 的 agent-data/" cargo-integration-tests.log; then
            echo "::error::pi 集成测试因找不到 agent-data/models.json 全部跳过 —— 这是假绿，不是通过"
            exit 1
          fi

      # ── 出包 ──────────────────────────────────────────────
      # 放在测试之后：测试红了就没必要编，编了也是白编。
      #
      # ⚠️ exe 必须与 dist/ 同目录分发 —— 见 tools/build-release.sh 的说明。
      #   tauri.conf.json 的 frontendDist 指向 ./stub-dist，那是编译期嵌进二进制的；
      #   而 build-release.sh 约定运行时再放一份真 dist/ 在 exe 旁边。**两份都要**。
      - name: Rust build (bin)
        run: cargo build --manifest-path src-tauri/Cargo.toml --bin orbcat

      - name: Package (unsigned)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out/dist | Out-Null
          Copy-Item src-tauri/target/debug/orbcat.exe out/orbcat-windows-x64.exe
          Copy-Item -Recurse -Force dist/* out/dist/
          Write-Output "=== artifact tree ==="
          Get-ChildItem -Recurse out | ForEach-Object {
            "{0,10}  {1}" -f $_.Length, $_.FullName.Substring((Resolve-Path out).Path.Length + 1)
          }

      - uses: actions/upload-artifact@v4
        with:
          name: orbcat-windows-x64-debug
          path: out/
          retention-days: 14

  # ---------------------------------------------------------------------------
  # macOS arm64 —— 本次改动的核心验证目标
  # ---------------------------------------------------------------------------
  build-macos:
    name: macOS (arm64, Apple Silicon)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: npm ci
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: No-user-data gate
        run: npm run check:no-user-data

      # ⚠️ 必须在下面任何 cargo 命令**之前**跑（2026-10-11 实测踩坑）。
      #   tauri-build 在编译期解析 bundle.resources，ResourcePaths::from_map
      #   走 Walk（递归列目录）不是 glob —— 源目录不存在直接
      #   `error: resource path '../dist' doesn't exist`，build script exit 101。
      #   dist/ 在 .gitignore 里，全新 checkout 根本没有它。
      #   这个 job 之前压根没有 build 前端，所以一 push 就全红。
      - name: Frontend build (dist must exist before cargo)
        run: npm run build

      # ★ 这一步是本次 CI 的核心：证明 `platform/` 抽象层在真实 macOS 上成立。
      #   在此之前，crate 因为 win32.rs / capture.rs / context.rs 里的裸 FFI
      #   **根本编译不过**（只有 win32desk.rs 挂了 #![cfg(windows)]）。
      - name: Rust check (lib)
        run: cargo check --manifest-path src-tauri/Cargo.toml --lib

      # 编译整个二进制（而不只是 lib）—— 这会走通 Tauri 的 build.rs，
      #   验证 objc2 / muda / tray-icon 等所有 macOS 原生依赖。
      - name: Rust build (bin)
        run: cargo build --manifest-path src-tauri/Cargo.toml --bin orbcat

      # lib 的单元测试。macOS 上多数测试与平台无关，应全部通过。
      #
      # ⚠️ 有 23 个测试是 **Windows-only**，它们硬编码了 `D:\…` 路径或依赖
      #    Windows 特有行为（`pwsh.exe` 存在、GBK 文件默认编码、盘符大小写不敏感）。
      #    在 macOS 上 `D:\foo` 只是一个相对文件名，断言必然失败 —— 那是**测试的
      #    平台依赖**，不是产品 bug。它们已加 `#[cfg(windows)]` 门，非 Windows 上
      #    根本不参与编译。
      #
      # 这里必须**如实汇报跳过数**，不要用 `--skip` 掩盖 —— 如果哪天新增的测试
      # 又因平台问题挂了，应该看到红色而不是静悄悄变绿。
      - name: Rust tests
        run: cargo test --lib --manifest-path src-tauri/Cargo.toml

      # ── 出包：.app + .dmg ─────────────────────────────────
      # 未签名 + 未公证，Gatekeeper 会拦 —— 这是预期的，
      #   试用时需 右键 → 打开，或用 xattr -d com.apple.quarantine 解隔离。
      # ⚠️ 必须显式带 `app`：`--bundles dmg` 时 Tauri 会把打完 dmg 的中间
      #    .app **删掉**（日志里有一行 `Cleaning .../bundle/macos/orbcat.app`），
      #    只剩 dmg 一个文件。下面的校验步骤要看 .app 内部结构，所以两个都要。
      #
      # tauri build 内部会自己再跑一次 beforeBuildCommand（npm run build），
      #   所以 dist/ 一定是当次构建的新鲜产物。
      - name: Bundle (app + dmg, unsigned)
        run: |
          npm run tauri -- build --bundles app,dmg
          echo "=== bundle output ==="
          ls -lh src-tauri/target/release/bundle/dmg/
          ls -lh src-tauri/target/release/bundle/macos/

      # ⚠️ 别只看 job 绿了就说成功 —— 一个 dist 没进包的 .dmg 也是绿的，
      #   装上去打开是白窗（回退到 stub-dist 占位页）。
      #   这里把 .app 实际结构打出来核对：dist 必须在
      #   Contents/Resources/dist/index.html —— 见 disk_assets.rs 的
      #   compute_dist_dir：.app 里 exe（Contents/MacOS/）与 Resources 不同目录。
      - name: Verify .app contains dist
        run: |
          APP="src-tauri/target/release/bundle/macos/orbcat.app"
          if [ ! -d "$APP" ]; then
            echo "FAIL: 找不到 .app：$APP"; exit 1
          fi
          echo "=== .app/Contents ==="
          ls -la "$APP/Contents"
          echo "=== Contents/MacOS ==="
          ls -la "$APP/Contents/MacOS"
          echo "=== Contents/Resources（dist 应在此） ==="
          ls -la "$APP/Contents/Resources" || true
          if [ ! -f "$APP/Contents/Resources/dist/index.html" ]; then
            echo "FAIL: .app 里没有 Contents/Resources/dist/index.html —— 装上去会是白窗"
            exit 1
          fi
          echo "OK: dist 已进包 Contents/Resources/dist/index.html"
          echo "=== dist 文件清单 ==="
          find "$APP/Contents/Resources/dist" -type f | head -20
          echo "=== 二进制架构核对 ==="
          file "$APP/Contents/MacOS/orbcat"
          lipo -archs "$APP/Contents/MacOS/orbcat"
          echo "=== dmg ==="
          ls -lh src-tauri/target/release/bundle/dmg/

      - uses: actions/upload-artifact@v4
        with:
          name: orbcat-macos-arm64-dmg
          path: |
            src-tauri/target/release/bundle/dmg/
            src-tauri/target/release/bundle/macos/
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Windows ARM64 —— 原生 ARM Windows（Snapdragon X / Azure Cobalt 等）
  #
  # 与 `build-windows` 的分工：那边跑完整回归（506 个测试），这边只回答**一个**
  # 问题 ——「这个 crate 在 ARM64 下能不能编出可执行文件」。
  #
  # 这**不是**把 x64 job 复制一遍改个 label。Win32 FFI 集中在
  # `platform/windows.rs`、`capture.rs`（GDI）、`win32desk.rs`，而 Windows API
  # 并非每个都有 arm64 变体；链接器还要 MSVC 的 ARM64 工具链。所以这是一个
  # 真会独立失败的验证点，值得单独一个 job。
  #
  # runner 是 GitHub 官方的 Windows 11 arm64 镜像（Azure Cobalt 100 / 4 vCPU）。
  # 公开仓库免费，不消耗付费配额；私有仓库要用更大的付费 arm runner。
  # ---------------------------------------------------------------------------
  build-windows-arm:
    name: Windows (arm64)
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: npm ci
        run: npm ci

      - name: No-user-data gate
        run: npm run check:no-user-data

      # ⚠️ 必须在 cargo 之前跑（2026-10-11 实测踩坑）：tauri-build 编译期解析
      #   bundle.resources，源目录 ../dist 不存在直接 exit 101；dist 在 .gitignore。
      - name: Frontend build (dist must exist before cargo)
        run: npm run build

      # lib 一层过不了就别谈产物了：crate 里绝大多数 win32 绑定都在 lib。
      - name: Rust check (lib)
        run: cargo check --manifest-path src-tauri/Cargo.toml --lib

      - name: Rust build (bin)
        run: cargo build --manifest-path src-tauri/Cargo.toml --bin orbcat

      # ⚠️ 不看这个，job 绿了也可能白绿 —— 得确认产物**真的是 ARM64**，
      #   而不是「编过了但拿了个别的东西」。直接读 PE 头的 machine 字段：
      #     0xAA64 = IMAGE_FILE_MACHINE_ARM64   0x8664 = IMAGE_FILE_MACHINE_AMD64
      #   PE 头的偏移在 e_lfanew（文件偏移 0x3C），machine 在 COFF 头开头，
      #   即 e_lfanew + 4。
      - name: Package + verify ARM64
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Copy-Item src-tauri/target/debug/orbcat.exe out/orbcat-windows-arm64.exe
          $len = (Get-Item out/orbcat-windows-arm64.exe).Length
          Write-Output "size = $len bytes"
          $bytes = [System.IO.File]::ReadAllBytes("out/orbcat-windows-arm64.exe")
          $pe = [System.BitConverter]::ToInt32($bytes, 0x3C)
          $machine = [System.BitConverter]::ToUInt16($bytes, $pe + 4)
          Write-Output ("PE machine = 0x{0:X4}" -f $machine)
          if ($machine -ne 0xAA64) {
            throw ("产物不是 ARM64！machine=0x{0:X4}，期望 0xAA64" -f $machine)
          }
          Write-Output "确认：ARM64 PE"

      # 不跑 506 个测试 —— 它们已在 x64 上跑过，重跑是纯开销。
      # 这里要回答的是「能不能编」，不是「行为对不对」。
      - uses: actions/upload-artifact@v4
        with:
          name: orbcat-windows-arm64-debug
          path: out/
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Release —— 只在 tag push 上跑，产物直接挂到 GitHub Release
  #
  # 与上面三个 job 的分工：那些是**回归闸门**（跑测试、证明能编），
  # 这个只回答「要发布的东西有没有编出来」。所以它**不跑测试** ——
  # 测试由同一 tag 触发的那三个 job 负责，红一个就不该走到发布。
  #
  # 三个平台的产物形态各不相同，各有各的坑：
  #   · Windows x64 —— exe + dist/ 分开（见 tools/build-release.sh：exe 不自包含前端）
  #   · Windows arm64 —— 同上，但要先验 PE machine 是不是 0xAA64
  #   · macOS arm64 —— .app 里 dist 在 Contents/Resources/dist，与 MacOS/ 不同目录
  #
  # ⚠️ 全部未签名未公证。Windows 会弹 SmartScreen，macOS 会被 Gatekeeper 拦
  #   （右键 → 打开）。这是预期的，发布说明里要写明。
  # ---------------------------------------------------------------------------
  release:
    name: Release artifacts (${{ matrix.artifact }})
    # tag push 才跑；日常分支 push / PR 直接跳过整个 matrix。
    #
    # ⚠️ workflow_dispatch 手动跑 = **只出产物、不发布**。
    #    「先让用户下载实测、通过再上线」这条流程需要一个不发版就能拿到
    #    release 产物的入口（debug job 的 exe 是 debug profile，测不出
    #    打包问题）。真正挂 Release 的是最后那个 Upload 步骤，它自己
    #    再闸一次 tag，手动跑绝不会创建 Release。
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      # 一个平台挂了不要拖掉另外两个的产物
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows-x64
            pkg: zip
          - os: macos-14
            artifact: macos-arm64
            pkg: dmg
          - os: windows-11-arm
            artifact: windows-arm64
            pkg: zip
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: npm ci
        run: npm ci

      # ⚠️ 必须在任何 cargo 命令**之前**跑（2026-10-11 实测踩坑）：
      #   tauri-build 编译期解析 bundle.resources，而它走的是 Walk 不是 glob ——
      #   源目录 ../dist 不存在就直接 `resource path '../dist' doesn't exist`，
      #   build script exit 101。dist/ 在 .gitignore 里，CI 全新 checkout 没有它。
      - name: Frontend build (dist must exist before cargo)
        run: npm run build

      # ---- 内置运行时（node + pi）---------------------------------------
      # 发布包必须带 runtime/{node,pi}：缺了 pi 内核在用户机器上**静默失效**
      # （启动日志只打一行「未找到内置 runtime/ —— pi 内核不可用，继续用旧内核」，
      #  用户看不出哪里不对），而 CI 之前是绿的（审计 F1/F2）。
      #
      # 分发内容（2026-10-23 用户拍板）：**只带 node + pi**（≈95MB）
      #   · node —— PTC run_code 的硬依赖，pi 本身也是 node 路线
      #   · pi   —— 内核本体
      #   · **不带 git**（GPLv2 不再分发）、**不带 python**（不是硬依赖，
      #     模型可能调而已 —— pi::bundled_python() 返回 Option，缺席即回落系统）
      #
      # ⚠️ 只在 Windows 装配 zip 时需要。macOS 那条走 tauri bundle 成 .app，
      #    它的 runtime 归属另议（现在 .app 里没有 runtime/，pi 内核在 macOS 上不可用）。
      #
      # ⚠️ 这里用**复合 action**，不自己再抄一份下载/构建逻辑 ——
      #    build-windows 那条要跑集成测试，也需要同一套 runtime；
      #    两边各抄一份的话，改了版本号只改一处，另一处照旧 ⇒ 又是一轮「各自实现」。
      - name: Setup runtime (node + pi)
        if: runner.os == 'Windows'
        uses: ./.github/actions/setup-runtime

      # ---- Windows（x64 / arm64）------------------------------------------
      - name: Build Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build --release --manifest-path src-tauri/Cargo.toml --bin orbcat
          # ⚠️ machine 字段在 **e_lfanew + 4**，不是固定的文件偏移 4。
          #    e_lfanew 存在 0x3C，指向 "PE\0\0" 签名。直接读偏移 4 读到的是
          #    DOS 头残留（实测 0x0003），会把好的产物误判成坏的。
          $bytes = [System.IO.File]::ReadAllBytes("src-tauri/target/release/orbcat.exe")
          $pe = [System.BitConverter]::ToInt32($bytes, 0x3C)
          $sig = [System.Text.Encoding]::ASCII.GetString($bytes, $pe, 4)
          if ($sig -ne "PE`0`0") { throw ("不是有效的 PE 文件：签名 '$sig'") }
          $machine = [System.BitConverter]::ToUInt16($bytes, $pe + 4)
          Write-Output ("PE machine = 0x{0:X4}" -f $machine)
          $want = if ("${{ matrix.artifact }}" -eq "windows-arm64") { 0xAA64 } else { 0x8664 }
          if ($machine -ne $want) {
            throw ("产物架构不对！machine=0x{0:X4}，期望 0x{1:X4}" -f $machine, $want)
          }
          # ⚠️ 装配与布局校验都走 tools/package.mjs，**不在这里自带一份复制逻辑**。
          #    2026-10-12 事故：这段曾经 `Copy-Item -Recurse -Force dist/* pkg/`
          #    把 dist 内容平铺进 pkg/ 根。dist 并没丢，只是摊平了，于是
          #    compute_dist_dir() 找不到 <exe 同目录>/dist/index.html，
          #    静默回退到编译期嵌的 stub 占位页 —— CI 全绿、Release 照发，
          #    只有真跑 exe 的用户看得见。
          #    现在布局被 tests/tools/package.test.ts 锁住（npm test 会跑），
          #    装配/自检只有这一份实现，改错会直接红在那个测试上。
          # 三合一分发：exe + dist/ + agent-data/（空骨架）。
          #   · --skeleton 只能指向 src-tauri/skeleton —— 那是编译期固定的空骨架。
          #     铺真实 agent-data/ 会被 verifyNoUserData 拦下（那等于把 API key 打进发布包）。
          #   · 刻意**不放** models.json：用户填了 key 的那个在 <exe 旁>/agent-data/models.json，
          #     zip 里放同名文件的话，更新时覆盖解压会把它冲掉。首次启动由 bootstrap 建空数组。
          node tools/package.mjs --exe src-tauri/target/release/orbcat.exe --dist dist --out pkg --skeleton src-tauri/skeleton --file README.md
          Compress-Archive -Path pkg/* -DestinationPath "orbcat-${{ matrix.artifact }}.zip" -Force
          # 解压后再验一次：真正发出去的是 zip，验的必须是 zip 的内容
          Remove-Item -Recurse -Force verify -ErrorAction SilentlyContinue
          Expand-Archive -Path "orbcat-${{ matrix.artifact }}.zip" -DestinationPath verify -Force
          Write-Output "=== zip 内容 ==="
          Get-ChildItem -Recurse verify | ForEach-Object {
            "{0,10}  {1}" -f $_.Length, $_.FullName.Substring((Resolve-Path verify).Path.Length + 1)
          }
          node tools/package.mjs --verify verify --exe-name orbcat.exe

      # ---- macOS（arm64）---------------------------------------------------
      # ⚠️ 必须显式带 `app`：`--bundles dmg` 时 Tauri 会把打完 dmg 的中间
      #    .app **删掉**（日志里一行 `Cleaning .../bundle/macos/orbcat.app`）。
      #    下面的校验要看 .app 内部结构，所以两个都要。
      - name: Bundle macOS (app + dmg, unsigned)
        if: runner.os == 'macOS'
        run: |
          npm run tauri -- build --bundles app,dmg
          APP="src-tauri/target/release/bundle/macos/orbcat.app"
          if [ ! -f "$APP/Contents/Resources/dist/index.html" ]; then
            echo "FAIL: .app 里没有 Contents/Resources/dist/index.html —— 装上去是白窗"
            exit 1
          fi
          echo "OK: dist 已进包"
          ls -lh src-tauri/target/release/bundle/dmg/
          lipo -archs "$APP/Contents/MacOS/orbcat"

      # ---- 先把产物留成 artifact -------------------------------------------
      # ⚠️ 这一步必须在 Upload **之前**，而且**不能省**：
      #    上传失败时（2026-10-12 实测整个仓库的 Actions GITHUB_TOKEN 是只读，
      #    三个平台全部 403 `Resource not accessible by integration`），
      #    runner 一销毁产物就没了，只能整轮重编。
      #    留成 artifact 之后，权限问题修好直接重跑 Upload 那一步就行，
      #    或者从 artifact 下载下来用别的途径发布。
      - name: Keep artifacts (survives upload failure)
        uses: actions/upload-artifact@v4
        with:
          name: orbcat-release-${{ matrix.artifact }}
          path: |
            orbcat-${{ matrix.artifact }}.zip
            src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: warn
          retention-days: 14

      # ---- 挂到 Release -----------------------------------------------------
      # `softprops/action-gh-release` 在 tag 存在但 Release 不存在时会自动创建，
      # 所以不需要额外一步 `gh release create`。
      #
      # ⚠️ 需要仓库 Settings → Actions → General → Workflow permissions
      #    为 **Read and write**（或至少勾上 Contents: write）。
      #    默认只读时这里稳定 403，三个平台一起挂 —— 但产物已由上面那步
      #    留住了，修权限后重跑本步骤即可，不必重新编译。
      - name: Upload to GitHub Release
        # ⚠️ 必须再闸一次 tag：workflow_dispatch 手动跑时这一整步要跳过，
        #    否则 softprops 会在没有 tag 的情况下**创建一个 Release**，
        #    正好把「先实测再上线」变成「直接上线」。
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: orbcat ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          # 发布说明用仓库里的 RELEASE_NOTES.md。
          # ⚠️ 不要改成 `body_path: CHANGELOG.md` —— CHANGELOG 里有 5 个
          #    都叫 [1.0.0] 的段（历史累积，只有第一段有日期），整个贴上去
          #    会把所有旧版本的内容混进 Release 页面。
          #    RELEASE_NOTES.md 由 tools/gen-release-notes.mjs 生成：
          #    只取 CHANGELOG 的第一个 [1.0.0] 段 + 手工维护的发布头。
          body_path: RELEASE_NOTES.md
          files: |
            orbcat-${{ matrix.artifact }}.zip
            src-tauri/target/release/bundle/dmg/*.dmg
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
