# 跨平台编译验证 CI
#
# ## 为什么需要这个
#
# 2026-10-10 抽出 `platform/` 层后，「macOS 能不能编译」成为 Mac 适配的**唯一未知数**。
# 本机（Windows）无法验证：`cargo check --target aarch64-apple-darwin` 会卡在
# Tauri 自己的依赖 `objc2-exception-helper`（需要 Xcode 的 Objective-C 编译器）。
# 所以唯一可靠的验证方式是**在真实 macOS runner 上跑**。
#
# ## 覆盖范围
#
# | job | 平台 | 验证什么 |
# |---|---|---|
# | `build-windows` | windows-latest | Windows 版没有回归（505 个测试 + tsc + vitest） |
# | `build-macos` | macos-14 (arm64) | **Mac 版能编译**（本次的核心目的） |
# | `build-macos-x64` | macos-13 (x86_64) | Intel Mac 也能编译（可能有 target 差异） |
#
# ## 注意：这里只编译，不跑测试
#
# macOS runner 上**跑不了**前台上下文相关测试 —— 那些需要真实的
# Accessibility 授权与前台窗口，CI 环境没有。`platform/macos.rs` 里的
# `osascript` 调用在无 GUI 会话的 CI 上会失败并降级，这是**预期行为**。
#
# 真正的端到端验证（授权弹窗、系统设置跳转）需要在有人使用的 Mac 上手动走查。

name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

# 取消同一分支的旧运行，省 Actions 配额
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Windows —— 防回归
  # ---------------------------------------------------------------------------
  build-windows:
    name: Windows (regression guard)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: npm ci
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Unit tests (frontend)
        run: npx vitest run

      - name: Rust check
        run: cargo check --manifest-path src-tauri/Cargo.toml --lib

      - name: Rust tests
        run: cargo test --lib --manifest-path src-tauri/Cargo.toml

  # ---------------------------------------------------------------------------
  # macOS arm64 —— 本次改动的核心验证目标
  # ---------------------------------------------------------------------------
  build-macos:
    name: macOS (arm64, Apple Silicon)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: npm ci
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      # ★ 这一步是本次 CI 的核心：证明 `platform/` 抽象层在真实 macOS 上成立。
      #   在此之前，crate 因为 win32.rs / capture.rs / context.rs 里的裸 FFI
      #   **根本编译不过**（只有 win32desk.rs 挂了 #![cfg(windows)]）。
      - name: Rust check (lib)
        run: cargo check --manifest-path src-tauri/Cargo.toml --lib

      # 编译整个二进制（而不只是 lib）—— 这会走通 Tauri 的 build.rs，
      #   验证 objc2 / muda / tray-icon 等所有 macOS 原生依赖。
      - name: Rust build (bin)
        run: cargo build --manifest-path src-tauri/Cargo.toml --bin orbcat

      # lib 的单元测试。macOS 上多数测试与平台无关，应全部通过。
      #
      # ⚠️ 有 23 个测试是 **Windows-only**，它们硬编码了 `D:\…` 路径或依赖
      #    Windows 特有行为（`pwsh.exe` 存在、GBK 文件默认编码、盘符大小写不敏感）。
      #    在 macOS 上 `D:\foo` 只是一个相对文件名，断言必然失败 —— 那是**测试的
      #    平台依赖**，不是产品 bug。它们已加 `#[cfg(windows)]` 门，非 Windows 上
      #    根本不参与编译。
      #
      # 这里必须**如实汇报跳过数**，不要用 `--skip` 掩盖 —— 如果哪天新增的测试
      # 又因平台问题挂了，应该看到红色而不是静悄悄变绿。
      - name: Rust tests
        run: cargo test --lib --manifest-path src-tauri/Cargo.toml

      # 产出可分发二进制，方便直接下载给朋友试用。
      # 注意：未签名 + 未公证，Gatekeeper 会拦 —— 这是预期的，
      #   试用时需 右键 → 打开，或用 xattr -d com.apple.quarantine 解隔离。
      - name: Package (unsigned)
        run: |
          mkdir -p out
          cp src-tauri/target/debug/orbcat out/orbcat-macos-arm64
          echo "=== binary info ==="
          file out/orbcat-macos-arm64
          ls -lh out/orbcat-macos-arm64

      - uses: actions/upload-artifact@v4
        with:
          name: orbcat-macos-arm64-debug
          path: out/
          retention-days: 14

  # ---------------------------------------------------------------------------
  # macOS x86_64 —— Intel Mac
  # ---------------------------------------------------------------------------
  build-macos-x64:
    name: macOS (x86_64, Intel)
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: npm ci
        run: npm ci

      # 只 check 不 build：这个 job 的目的是确认「Intel Mac 也能过类型检查」，
      #   完整构建交给 arm64 job，避免浪费 runner 时间。
      - name: Rust check (lib)
        run: cargo check --manifest-path src-tauri/Cargo.toml --lib

      # 与 arm64 job 同理：23 个 Windows-only 测试已加 cfg 门，此处应全绿。
      - name: Rust tests
        run: cargo test --lib --manifest-path src-tauri/Cargo.toml
