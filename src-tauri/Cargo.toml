[package]
name = "orbcat"
version = "0.2.0"
description = "悬浮球形态的私人 agent（Windows 桌面）"
authors = ["lll152"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "orbcat_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
# --- 依赖兼容补丁（不是新增依赖，indexmap 本就在依赖树里）---
# 报错现象（清 `target/**/build/` 后必现）：
#   error[E0107]: struct takes 3 generic arguments but 2 were supplied
#     --> schemars-0.8.22/src/lib.rs:12:32
#     12 | pub type Map<K, V> = indexmap::IndexMap<K, V>;
#
# 链条：orbcat → (build-dep) tauri-build → schemars 0.8.22 →（preserve_order）
#       indexmap 1.9.3
# 根因：indexmap 1.9.3 把 `std` 做成**非默认** feature，正常靠自己的 build.rs 里
#       `autocfg 0.8` 探测 sysroot 自动补。但 autocfg 0.8 在 rustc 1.96 下探测失效
#       （实测该 build script 的 `output` 文件**为空**，没有 `rustc-cfg=has_std`）→
#       `IndexMap<K,V,S>` 第三个泛型拿不到默认 `RandomState` → 编译失败。
#
# ⚠️ 关键：必须写在 **[build-dependencies]** 而不是 [dependencies]。
#    Cargo 对 build-dep 图与 normal 图**分别解析 feature、不合并**；
#    schemars 在 build-dep 图里，写在 [dependencies] 完全不起作用
#    （`cargo tree -e features -i indexmap@1.9.3` 会把它显示成两块，一块无 std）。
#
# 旧 `target/` 缓存会掩盖这个问题 —— 故"改名/移动目录后重建"或任何一次干净构建都会撞上。
indexmap = { version = "1.9.3", features = ["std"] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# --- agent loop 所需 ---
# TLS：Windows 上必须用 native-tls（SChannel），不能用 rustls。
# 2026-09-21 实测：ark.cn-beijing.volces.com 在 rustls 下 body≥16KB 会
# `error sending request ← operation timed out`，同请求 SChannel/.NET 正常。
# native-tls 在 Windows 走系统 schannel，不依赖 openssl。
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "native-tls"] }
# process / io-util：命令执行器（shell.rs）要起子进程 + 并发读管道（仅在 feature 层面扩展，
# 不引入新 crate）
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "process", "io-util"] }
futures-util = "0.3"
glob = "0.3"
# 项目/会话索引库（仿 WorkBuddy：SQLite 只管索引，长期记忆仍写 md）
rusqlite = { version = "0.32", features = ["bundled"] }

# --- 截图 / 图片 ---
# 截图走 Win32 原生 API（见 capture.rs），不引入重型截图库；
# 图片编码主用 JPEG（同等观感体积只有 PNG 的 1/6 左右，vision 请求快很多）
#
# feature 面（2026-10-08 补）：gif / webp / bmp 是给「模型在回复里发图」加的。
# 表情包大量是 GIF / WebP，只开 jpeg+png 时 `image::open` 会直接失败，
# 用户看到的是"图（读不出来）"——`images::is_image_path` 早就认这些扩展名了，
# 能认出却不能解码是自相矛盾的。
image = { version = "0.25", default-features = false, features = [
    "jpeg",
    "png",
    "gif",
    "webp",
    "bmp",
] }
base64 = "0.22"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# --- 开发期编译加速（2026-09-29 新增）---
# 只影响 dev profile，不动 release 产物。
# 背景：debug target 已膨胀到 12G，"改一行 Rust 就猛猛编译"。
[profile.dev]
# 默认 debug=2 会生成完整调试信息，是 dev 编译慢 + target 膨胀的主因；
# 降到 1（行号级）足够定位 panic 栈，日常开发不需要 gdb 级变量查看。
debug = 1
# 显式开启增量编译（默认已是 true，写明防被上层 config 覆盖）
incremental = true

# 依赖永远用 O3 编一次就缓存住，之后只重编自己那点代码。
# 首次全量编译会慢一点（一次性成本），之后每次增量显著变快，
# 且 Tauri 依赖在 O0 下运行时也慢得离谱 —— 这是官方推荐配置。
[profile.dev.package."*"]
opt-level = 3

# --- 日常/测试档（2026-09-29 实测落地）---
# 与 release 完全隔离：产物在 target/release-fast/，切换档位不影响 release 缓存。
# 实测稳态只重编 orbcat 自己（24.5k 行）：**55s**（fat LTO 同场景 5m17s）。
#
# ⚠️ 不要用 CARGO_PROFILE_RELEASE_* 环境变量覆盖 release 来做这件事 ——
#    实测 env 覆盖会污染 fingerprint，切换参数触发 294 个依赖全量重编（5m15s）。
#    独立 profile 有各自的 target 子目录，互不干扰。
[profile.release-fast]
inherits = "release"
lto = false
codegen-units = 256
debug = false
